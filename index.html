<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Professional Image Gallery</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #222;
        }

        /* Header */
        header {
            text-align: center;
            padding: 40px 20px 25px;
            background: #1e293b;
            color: white;
        }

        header h1 {
            font-size: 36px;
            margin-bottom: 10px;
        }

        header p {
            font-size: 16px;
            color: #cbd5e1;
        }

        /* Filter Buttons */
        .filters {
            text-align: center;
            padding: 25px 15px;
        }

        .filter-btn {
            border: none;
            padding: 10px 20px;
            margin: 5px;
            border-radius: 25px;
            background: #e2e8f0;
            color: #334155;
            cursor: pointer;
            font-size: 15px;
            transition: 0.3s;
        }

        .filter-btn:hover,
        .filter-btn.active {
            background: #2563eb;
            color: white;
        }

        /* Gallery */
        .gallery {
            width: 90%;
            max-width: 1200px;
            margin: auto;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            padding-bottom: 40px;
        }

        .gallery-item {
            position: relative;
            height: 250px;
            overflow: hidden;
            border-radius: 12px;
            background: white;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.12);
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .gallery-item:hover {
            transform: translateY(-5px);
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .gallery-item:hover img {
            transform: scale(1.1);
        }

        /* Image Overlay */
        .overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 15px;
            background: linear-gradient(transparent, rgba(0, 0, 0, 0.8));
            color: white;
            opacity: 0;
            transition: 0.3s ease;
        }

        .gallery-item:hover .overlay {
            opacity: 1;
        }

        .overlay h3 {
            font-size: 18px;
        }

        /* Lightbox */
        .lightbox {
            display: none;
            position: fixed;
            z-index: 1000;
            inset: 0;
            background: rgba(0, 0, 0, 0.9);
            justify-content: center;
            align-items: center;
        }

        .lightbox.active {
            display: flex;
        }

        .lightbox img {
            max-width: 85%;
            max-height: 80%;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        }

        /* Lightbox Buttons */
        .close,
        .prev,
        .next {
            position: absolute;
            color: white;
            cursor: pointer;
            font-size: 40px;
            user-select: none;
            transition: 0.3s;
        }

        .close:hover,
        .prev:hover,
        .next:hover {
            color: #60a5fa;
        }

        .close {
            top: 20px;
            right: 35px;
            font-size: 45px;
        }

        .prev {
            left: 30px;
        }

        .next {
            right: 30px;
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 20px;
            background: #1e293b;
            color: #cbd5e1;
        }

        /* Tablet */
        @media (max-width: 900px) {
            .gallery {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        /* Mobile */
        @media (max-width: 650px) {
            header h1 {
                font-size: 28px;
            }

            .gallery {
                grid-template-columns: repeat(2, 1fr);
                gap: 12px;
            }

            .gallery-item {
                height: 180px;
            }

            .prev {
                left: 10px;
            }

            .next {
                right: 10px;
            }

            .lightbox img {
                max-width: 90%;
            }
        }

        @media (max-width: 400px) {
            .gallery {
                grid-template-columns: 1fr;
            }

            .gallery-item {
                height: 250px;
            }
        }
    </style>
</head>

<body>

    <!-- Header -->
    <header>
        <h1>Image Gallery</h1>
        <p>Explore beautiful moments through our collection</p>
    </header>

    <!-- Filters -->
    <div class="filters">
        <button class="filter-btn active" onclick="filterImages('all', this)">
            All
        </button>

        <button class="filter-btn" onclick="filterImages('nature', this)">
            Nature
        </button>

        <button class="filter-btn" onclick="filterImages('city', this)">
            City
        </button>

        <button class="filter-btn" onclick="filterImages('travel', this)">
            Travel
        </button>
    </div>

    <!-- Gallery -->
    <div class="gallery">

        <div class="gallery-item" data-category="nature"
             onclick="openLightbox(0)">
            <img src="https://picsum.photos/id/1018/800/600" alt="Mountain">
            <div class="overlay">
                <h3>Mountain Landscape</h3>
            </div>
        </div>

        <div class="gallery-item" data-category="nature"
             onclick="openLightbox(1)">
            <img src="https://picsum.photos/id/1015/800/600" alt="Nature">
            <div class="overlay">
                <h3>Beautiful Nature</h3>
            </div>
        </div>

        <div class="gallery-item" data-category="city"
             onclick="openLightbox(2)">
            <img src="https://picsum.photos/id/1011/800/600" alt="City">
            <div class="overlay">
                <h3>City View</h3>
            </div>
        </div>

        <div class="gallery-item" data-category="travel"
             onclick="openLightbox(3)">
            <img src="https://picsum.photos/id/1036/800/600" alt="Travel">
            <div class="overlay">
                <h3>Travel Destination</h3>
            </div>
        </div>

        <div class="gallery-item" data-category="nature"
             onclick="openLightbox(4)">
            <img src="https://picsum.photos/id/1020/800/600" alt="Forest">
            <div class="overlay">
                <h3>Green Forest</h3>
            </div>
        </div>

        <div class="gallery-item" data-category="city"
             onclick="openLightbox(5)">
            <img src="https://picsum.photos/id/1031/800/600" alt="Architecture">
            <div class="overlay">
                <h3>Modern Architecture</h3>
            </div>
        </div>

        <div class="gallery-item" data-category="travel"
             onclick="openLightbox(6)">
            <img src="https://picsum.photos/id/1043/800/600" alt="Travel">
            <div class="overlay">
                <h3>Adventure</h3>
            </div>
        </div>

        <div class="gallery-item" data-category="city"
             onclick="openLightbox(7)">
            <img src="https://picsum.photos/id/1060/800/600" alt="City">
            <div class="overlay">
                <h3>Urban Life</h3>
            </div>
        </div>

    </div>

    <!-- Lightbox -->
    <div class="lightbox" id="lightbox">

        <span class="close" onclick="closeLightbox()">&times;</span>

        <span class="prev" onclick="changeImage(-1)">&#10094;</span>

        <img id="lightboxImage" src="" alt="Preview">

        <span class="next" onclick="changeImage(1)">&#10095;</span>

    </div>

    <!-- Footer -->
    <footer>
        <p>© 2026 Professional Image Gallery | Designed with HTML, CSS & JavaScript</p>
    </footer>


    <script>

        /* Image Data */
        const images = [
            "https://picsum.photos/id/1018/1200/800",
            "https://picsum.photos/id/1015/1200/800",
            "https://picsum.photos/id/1011/1200/800",
            "https://picsum.photos/id/1036/1200/800",
            "https://picsum.photos/id/1020/1200/800",
            "https://picsum.photos/id/1031/1200/800",
            "https://picsum.photos/id/1043/1200/800",
            "https://picsum.photos/id/1060/1200/800"
        ];

        let currentIndex = 0;

        /* Open Lightbox */
        function openLightbox(index) {
            currentIndex = index;

            document.getElementById("lightboxImage").src =
                images[currentIndex];

            document.getElementById("lightbox").classList.add("active");
        }

        /* Close Lightbox */
        function closeLightbox() {
            document.getElementById("lightbox").classList.remove("active");
        }

        /* Next / Previous */
        function changeImage(direction) {

            currentIndex += direction;

            if (currentIndex >= images.length) {
                currentIndex = 0;
            }

            if (currentIndex < 0) {
                currentIndex = images.length - 1;
            }

            document.getElementById("lightboxImage").src =
                images[currentIndex];
        }

        /* Filter Images */
        function filterImages(category, button) {

            const items = document.querySelectorAll(".gallery-item");

            /* Update active button */
            document.querySelectorAll(".filter-btn").forEach(btn => {
                btn.classList.remove("active");
            });

            button.classList.add("active");

            /* Show / Hide Images */
            items.forEach(item => {

                if (
                    category === "all" ||
                    item.dataset.category === category
                ) {
                    item.style.display = "block";
                } else {
                    item.style.display = "none";
                }

            });
        }

        /* Keyboard Navigation */
        document.addEventListener("keydown", function(event) {

            const lightbox =
                document.getElementById("lightbox");

            if (!lightbox.classList.contains("active")) {
                return;
            }

            if (event.key === "ArrowRight") {
                changeImage(1);
            }

            if (event.key === "ArrowLeft") {
                changeImage(-1);
            }

            if (event.key === "Escape") {
                closeLightbox();
            }

        });

    </script>

</body>
</html>
